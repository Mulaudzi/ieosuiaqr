name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: qr_test
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, json
          coverage: xdebug

      - name: Install Composer dependencies
        working-directory: ./api
        run: composer install --prefer-dist --no-progress

      - name: Create test environment
        working-directory: ./api
        run: |
          cp .env.example .env 2>/dev/null || echo "No .env.example"
          echo "APP_ENV=testing" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_NAME=qr_test" >> .env
          echo "DB_USER=root" >> .env
          echo "DB_PASS=root" >> .env
          echo "JWT_SECRET=test-secret-key" >> .env

      - name: Load database schema and migrations
        run: |
          mariadb -h 127.0.0.1 -uroot -proot qr_test < api/database/schema.sql
          for migration in api/database/migrations/*.sql; do
            case "$migration" in *027_link_central_identities.sql|*028_purge_local_credentials.sql) continue;; esac
            mariadb -h 127.0.0.1 -uroot -proot qr_test < "$migration"
          done

      - name: Run PHPUnit tests
        working-directory: ./api
        run: composer test

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build
