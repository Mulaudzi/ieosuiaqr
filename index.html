    <meta name="description" content="Create, update, and track QR codes with inventory management for businesses, churches, schools & more. Dynamic QRs with scan insights." />

    <link rel="shortcut icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <script>
      (function () {
        var path = window.location.pathname.replace(/\/+$/, '') || '/';
        if (path === '/login' && !window.location.hash.includes('ieosuia_token=')) window.location.replace('/api/auth/ieosuia/start');
        if (path === '/signup') window.location.replace('/api/auth/ieosuia/start?screen_hint=signup');
      })();
    </script>

    <meta property="og:title" content="IEOSUIA QR - Smart QR Codes for Business" />
